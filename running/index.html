<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RunPlan</title>
<meta name="theme-color" content="#FF5A36">
<meta name="description" content="Plan d'entraînement et historique de course à pied, privé et hors ligne.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RunPlan">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <span class="brand">
    <svg class="brand-logo" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"></circle>
      <path d="M12 12 L12 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
      <path d="M12 12 L16.5 9.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
    </svg>
    RunPlan
  </span>
  <h1 id="view-title">Dashboard</h1>
</header>

<main id="app">

  <!-- DASHBOARD -->
  <section class="view" id="view-dashboard" data-view="dashboard">
    <div class="card-grid" id="goals-countdown"></div>

    <div class="card">
      <h2>Cette semaine</h2>
      <div class="stat-row" id="week-stats"></div>
    </div>

    <div class="card">
      <h2>Volume hebdomadaire</h2>
      <canvas id="week-chart" width="600" height="220" role="img" aria-label="Graphique du volume de course des 8 dernières semaines"></canvas>
    </div>

    <div class="card">
      <h2>Prochaine séance</h2>
      <div id="next-session">Aucune séance planifiée.</div>
    </div>

    <div class="card">
      <h2>Records personnels</h2>
      <div class="stat-row" id="personal-records"></div>
    </div>
  </section>

  <!-- PLAN -->
  <section class="view" id="view-plan" data-view="plan" hidden>
    <div class="section-actions">
      <button class="btn btn-primary" id="btn-new-goal">+ Nouvel objectif</button>
    </div>
    <div id="goals-list"></div>
  </section>

  <!-- HISTORIQUE -->
  <section class="view" id="view-history" data-view="history" hidden>
    <div class="card">
      <h2>Statistiques globales</h2>
      <div class="stat-row" id="global-stats"></div>
    </div>
    <div class="section-actions">
      <button class="btn btn-primary" id="btn-new-run">+ Ajouter une course</button>
    </div>
    <div id="runs-list"></div>
  </section>

</main>

<nav class="tabbar">
  <button class="tab-btn active" data-view="dashboard" aria-label="Dashboard">
    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 3 2 12h3v8h6v-6h2v6h6v-8h3z"/></svg>
    <span>Accueil</span>
  </button>
  <button class="tab-btn" data-view="plan" aria-label="Plan d'entraînement">
    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M7 2h10a2 2 0 0 1 2 2v16a1 1 0 0 1-1.45.9L12 18l-5.55 2.9A1 1 0 0 1 5 20V4a2 2 0 0 1 2-2z"/></svg>
    <span>Plan</span>
  </button>
  <button class="tab-btn" data-view="history" aria-label="Historique">
    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 2a10 10 0 1 0 10 10h-2a8 8 0 1 1-8-8V2z"/><path fill="currentColor" d="M12 3v2a7 7 0 1 1-7 7H3a9 9 0 1 0 9-9z" opacity="0"/><path fill="currentColor" d="M13 7h-2v6l5 3 1-1.6-4-2.4z"/></svg>
    <span>Historique</span>
  </button>
</nav>

<!-- GOAL FORM DIALOG -->
<dialog id="dlg-goal">
  <form method="dialog" id="form-goal" class="dlg-form">
    <h2>Nouvel objectif</h2>
    <label>Nom de l'objectif
      <input type="text" id="goal-name" placeholder="Ex: 10km de la ville" required>
    </label>
    <label>Distance de la course (km)
      <input type="number" id="goal-distance" min="1" step="0.1" required>
    </label>
    <label>Date de la course
      <input type="date" id="goal-date" required>
    </label>
    <label>Séances par semaine
      <select id="goal-sessions">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3" selected>3</option>
      </select>
    </label>
    <div class="dlg-actions">
      <button type="button" class="btn btn-ghost" data-close>Annuler</button>
      <button type="submit" class="btn btn-primary">Créer le plan</button>
    </div>
  </form>
</dialog>

<!-- SESSION DONE FORM DIALOG -->
<dialog id="dlg-session-done">
  <form method="dialog" id="form-session-done" class="dlg-form">
    <h2>Séance réalisée</h2>
    <p class="dlg-hint" id="session-done-target"></p>
    <input type="hidden" id="done-session-id">
    <label>Distance réelle (km)
      <input type="number" id="done-distance" min="0" step="0.01" required>
    </label>
    <label>Durée réelle (minutes)
      <input type="number" id="done-duration" min="0" step="1" required>
    </label>
    <label>Notes (optionnel)
      <textarea id="done-notes" rows="2"></textarea>
    </label>
    <div class="dlg-actions">
      <button type="button" class="btn btn-ghost" data-close>Annuler</button>
      <button type="submit" class="btn btn-primary">Enregistrer</button>
    </div>
  </form>
</dialog>

<!-- RUN FORM DIALOG -->
<dialog id="dlg-run">
  <form method="dialog" id="form-run" class="dlg-form">
    <h2 id="run-dlg-title">Ajouter une course</h2>
    <input type="hidden" id="run-id">
    <label>Date
      <input type="date" id="run-date" required>
    </label>
    <label>Type de séance
      <select id="run-type">
        <option>Endurance fondamentale</option>
        <option>Fractionné</option>
        <option>Tempo</option>
        <option>Sortie longue</option>
        <option>Récupération</option>
        <option>Course</option>
      </select>
    </label>
    <label>Distance (km)
      <input type="number" id="run-distance" min="0" step="0.01" required>
    </label>
    <label>Durée (minutes)
      <input type="number" id="run-duration" min="0" step="1" required>
    </label>
    <label>Dénivelé (m, optionnel)
      <input type="number" id="run-elevation" min="0" step="1">
    </label>
    <label>Notes (optionnel)
      <textarea id="run-notes" rows="2"></textarea>
    </label>
    <div class="dlg-actions">
      <button type="button" class="btn btn-danger" id="btn-delete-run" hidden>Supprimer</button>
      <button type="button" class="btn btn-ghost" data-close>Annuler</button>
      <button type="submit" class="btn btn-primary">Enregistrer</button>
    </div>
  </form>
</dialog>

<script src="js/app.js"></script>
</body>
</html>
