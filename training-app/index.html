<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Coach Running pour Rémi</title>
  <meta name="description" content="Génération de plans d'entraînement course à pied et trail, fondée sur VDOT, GAP et charge d'entraînement." />
  <meta name="theme-color" content="#020304" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/icon-180.svg" />
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/app.css" />
  <!-- MapLibre GL JS (carte 3D du parcours avec relief, Jour de course) —
       chargé en CDN à l'exécution dans le navigateur de l'utilisateur, PAS
       via npm dans cet environnement de build (aucun accès au registre npm
       ici, cf. README). jourCourse.js détecte l'absence de
       `window.maplibregl` (hors-ligne, CDN bloqué) et bascule sur une carte
       schématique 100% locale (RouteMapFallback, components.js). Pas de SRI
       ici (contrairement à Leaflet auparavant) : un hash saisi de mémoire et
       faux casserait le chargement du script de façon silencieuse et
       impossible à diagnostiquer à distance — risque jugé pire que
       l'absence de SRI pour une bibliothèque open source largement utilisée. -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" defer></script>
</head>
<body>
  <header class="app-topbar">
    <a class="app-topbar__brand" href="#/dashboard">Coach Running pour Rémi</a>
  </header>

  <main id="app-view"></main>

  <nav class="app-bottomnav" id="app-nav">
    <a href="#/dashboard" data-route="dashboard"><span class="icon">◆</span>Accueil</a>
    <a href="#/plan" data-route="plan"><span class="icon">▤</span>Plan</a>
    <a href="#/journal" data-route="journal"><span class="icon">✎</span>Journal</a>
    <a href="#/historique" data-route="historique"><span class="icon">∿</span>Stats</a>
    <a href="#/menu" data-route="menu" data-subroutes="renfo,nutrition,jour-course,profil,reglages"><span class="icon">⋯</span>Plus</a>
  </nav>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
